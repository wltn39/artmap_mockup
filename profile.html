<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Art Map</title>
  <link rel="icon" href="image/pavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
    }
    .profile-container {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 0 90px 0;
      min-height: 100vh;
      background: #fff;
      box-sizing: border-box;
    }
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 10px 20px;
    }
    .profile-title {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: -1px;
    }
    .profile-bell {
      width: 26px;
      height: 26px;
      stroke: #222;
      opacity: 0.7;
    }
    .profile-main {
      padding: 0 20px;
    }
    .profile-user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .profile-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .profile-user-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #eee;
    }
    .profile-user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .profile-user-name {
      font-size: 1.07rem;
      font-weight: bold;
    }
    .profile-user-link {
      font-size: 0.97rem;
      color: #888;
      font-weight: 400;
    }
    .profile-arrow {
      width: 22px;
      height: 22px;
      stroke: #bbb;
    }
    .profile-host-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1.5px solid #f2f2f2;
      padding: 18px 16px 18px 16px;
      display: flex;
      align-items: center;
      margin-bottom: 32px;
      gap: 18px;
    }
    .host-card-img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      background: #f9f9f9;
      flex-shrink: 0;
    }
    .host-card-texts {
      flex: 1;
      min-width: 0;
    }
    .host-card-title {
      font-size: 1.09rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .host-card-desc {
      font-size: 0.97rem;
      color: #888;
      line-height: 1.4;
    }
    .profile-section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0 0 10px 0;
      padding-left: 2px;
    }
    .profile-setting-list {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      border: 1.5px solid #f2f2f2;
      overflow: hidden;
    }
    .profile-setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 18px 16px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 1.01rem;
      color: #222;
      background: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .profile-setting-item:last-child {
      border-bottom: none;
    }
    .profile-setting-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .profile-setting-icon {
      width: 22px;
      height: 22px;
      color: #e5005a;
      opacity: 0.8;
    }
    .profile-setting-arrow {
      width: 20px;
      height: 20px;
      stroke: #bbb;
    }
    /* 호스트 모드 전환 토스트 */
    .host-toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      border-radius: 22px;
      padding: 13px 28px;
      font-size: 1.07rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeInOut 2.5s;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }   
    
  </style>
</head>
<body>
  <div class="profile-container">
    <!-- 상단 헤더 -->
    <div class="profile-header">
      <span class="profile-title">프로필</span>
      <svg class="profile-bell" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11c0-3.07-1.64-5.64-5-6.32V4a1 1 0 0 0-2 0v.68C7.64 5.36 6 7.929 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="profile-main">
      <!-- 프로필 정보 -->
      <div class="profile-user-row">
        <div class="profile-user">
          <img class="profile-user-img" src="https://randomuser.me/api/portraits/men/32.jpg" alt="프로필 이미지">
          <div class="profile-user-info">
            <span class="profile-user-name">Jaeho</span>
            <span class="profile-user-link">프로필 열기</span>
          </div>
        </div>
        <svg class="profile-arrow" viewBox="0 0 24 24" fill="none">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- 호스팅 안내 카드 -->
      <div class="profile-host-card">
        <div class="host-card-texts">
          <div class="host-card-title">당신의 예술을<br>아트맵하세요</div>
          <div class="host-card-desc">간단하게 전시를 시작하고 부수입을 올릴 수 있습니다.</div>
        </div>
        <img class="host-card-img" src="https://cdn-icons-png.flaticon.com/512/235/235861.png" alt="에어비앤비 호스트 안내">
      </div>
      <!-- 설정 섹션 -->
      <div class="profile-section-title">설정</div>
      <div class="profile-setting-list">
        <div class="profile-setting-item">
          <div class="profile-setting-left">
            <svg class="profile-setting-icon" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="#e5005a" stroke-width="2"/>
              <path d="M6 20v-2a4 4 0 0 1 8 0v2" stroke="#e5005a" stroke-width="2"/>
            </svg>
            개인 정보
          </div>
          <svg class="profile-setting-arrow" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="profile-setting-item">
          <div class="profile-setting-left">
            <svg class="profile-setting-icon" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="4" width="16" height="16" rx="2" stroke="#e5005a" stroke-width="2"/>
              <path d="M8 12h8" stroke="#e5005a" stroke-width="2"/>
            </svg>
            로그인 및 보안
          </div>
          <svg class="profile-setting-arrow" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="profile-setting-item">
          <div class="profile-setting-left">
            <svg class="profile-setting-icon" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="6" width="18" height="12" rx="2" stroke="#e5005a" stroke-width="2"/>
              <path d="M3 10h18" stroke="#e5005a" stroke-width="2"/>
            </svg>
            결제 및 정산
          </div>
          <svg class="profile-setting-arrow" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
    <!-- 호스트 모드 전환 토스트 -->
    <a href = "host.html">
    <div class="host-toast">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
      호스트 모드로 전환
    </div>
  </div>
  <!-- 하단 네비게이션 (기존 코드 그대로) -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item selected">
      <svg width="24" height="24" fill="none" stroke="#e5005a" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="17" y1="17" x2="21" y2="21"/>
      </svg>
      <span>검색</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="#bbb" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 21C12 21 4 13.5 4 8.5C4 5.42 6.42 3 9.5 3C11.24 3 12.91 3.81 14 5.08C15.09 3.81 16.76 3 18.5 3C21.58 3 24 5.42 24 8.5C24 13.5 16 21 16 21H12Z"/>
      </svg>
      <span>위시리스트</span>
    </a>
    <a href="schedule.html" class="nav-item">
      <img src="image/geonsi.png" alt="내 일정" width="24" height="24" style="margin-bottom:3px;">
      <span>내 일정</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="#bbb" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>메시지</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="#bbb" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a4 4 0 0 1 8 0v2"/>
      </svg>
      <span>프로필</span>
    </a>
  </div>
  </div>
</body>
</html>
