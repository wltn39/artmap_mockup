<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Art Map</title>
  <link rel="icon" href="image/pavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; }
    .map-title {
      font-size: 1.2em; font-weight: bold; padding: 18px 16px 12px 16px;
      background: #fff; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .map-wrap {
      flex: 1 1 0%;
      width: 100vw;
      min-height: 0;
      position: relative;
    }
    .root_daum_roughmap_landing {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
    }
    .home-fab-center {
      position: fixed;
      left: 50%;
      bottom: 80px; /* 네비게이션 위에 보이도록 조정 */
      transform: translateX(-50%);
      z-index: 1000;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 32px;
      min-width: 150px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      padding: 0 32px;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .home-fab-center:hover { background: #444; }
    .home-fab-center svg {
      width: 32px; height: 32px; fill: #fff; margin-right: 6px;
    }
    @media (max-width: 500px) {
      .home-fab-center {
        min-width: 110px; font-size: 1em; height: 46px; padding: 0 18px;
      }
      .home-fab-center svg { width: 22px; height: 22px; }
    }
  </style>
</head>
<body>
  <!-- 상단 검색바 -->
  <div class="search-bar">
    <input class="search-box" placeholder="검색 시작하기" />
    <button class="search-menu-btn">
      <svg width="20" height="20" fill="none" stroke="#888" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
    </button>
  </div>
  <!-- 카테고리 탭 -->
  <div class="category-tabs" id="categoryTabs">
    <div class="category-tab selected">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8" cy="10" r="2"/>
        <path d="M21 20l-5.5-6.5-4.5 5.5-3-4L3 20"/>
      </svg>
      갤러리/전시회
    </div>
    <div class="category-tab">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M2 10c0 6 10 12 10 12s10-6 10-12V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v5z"/>
        <path d="M8 10h.01M16 10h.01"/>
      </svg>
      연극/공연
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      사진전
    </div>
    <div class="category-tab">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M12 17v5"/>
        <path d="M8 22h8"/>
      </svg>
      콘서트
    </div>
    <div class="category-tab">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      뮤지컬
    </div>    
  </div>
  <!-- 지도 타이틀 -->
  <div class="map-title">우리 지역 미술/전시 추천</div>
  <div class="map-wrap">  
    <!-- 카카오맵 - 지도퍼가기 -->
    <div id="daumRoughmapContainer1744946690149" class="root_daum_roughmap root_daum_roughmap_landing"></div>
    <script charset="UTF-8" class="daum_roughmap_loader_script" src="https://ssl.daumcdn.net/dmaps/map_js_init/roughmapLoader.js"></script>
    <script charset="UTF-8">
      new daum.roughmap.Lander({
        "timestamp" : "1744946690149",
        "key" : "2nr6f",
        "mapWidth" : "100%",
        "mapHeight" : "100%"
      }).render();
    </script>
  </div>
  <!-- 하단 중앙 홈으로 버튼 -->
  <button class="home-fab-center" id="homeFab" title="홈으로">
    <svg viewBox="0 0 24 24">
      <path d="M3 12L12 4l9 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 21V12h6v9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 21H3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>홈으로</span>
  </button>
  <!-- 하단 네비게이션 -->
  <div class="bottom-nav">
    <div class="nav-item selected">
      <svg width="20" height="20" fill="none" stroke="#888" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="17" y1="17" x2="21" y2="21"/>
      </svg>      
      검색
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 21C12 21 4 13.5 4 8.5C4 5.42 6.42 3 9.5 3C11.24 3 12.91 3.81 14 5.08C15.09 3.81 16.76 3 18.5 3C21.58 3 24 5.42 24 8.5C24 13.5 16 21 16 21H12Z"/>
      </svg>
      위시리스트
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M2.5 19.5l19-7-19-7v5l15 2-15 2z"/>
      </svg>
      여행
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      메시지
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a4 4 0 0 1 8 0v2"/>
      </svg>
      프로필
    </div>
  </div>
  <script>
    document.getElementById('homeFab').addEventListener('click', function() {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
