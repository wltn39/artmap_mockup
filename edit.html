<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Art Map</title>
  <link rel="icon" href="image/pavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
    }
    .container {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 80px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    /* 상단 바 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 10px 16px;
      position: relative;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-bar-title {
      font-size: 1.13rem;
      font-weight: bold;
      letter-spacing: -0.5px;
    }
    .top-bar-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0 6px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .top-bar-btn svg {
      width: 25px;
      height: 25px;
      color: #222;
      stroke-width: 2.2;
    }
    .top-bar-settings {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-left: 6px;
      display: flex;
      align-items: center;
    }
    .top-bar-settings svg {
      width: 23px;
      height: 23px;
      color: #888;
    }
    /* 탭 */
    .tab-bar {
      display: flex;
      margin: 12px 16px 18px 16px;
      gap: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 20px;
      background: #f3f3f3;
      color: #888;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: #fff;
      color: #222;
      border: 1.5px solid #e5005a;
      font-weight: bold;
    }
    /* 카드 스타일 */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      border: 1.5px solid #f2f2f2;
      margin: 0 16px 16px 16px;
      padding: 18px 16px;
      font-size: 1.02rem;
      position: relative;
    }
    .card-arrow {
      position: absolute;
      right: 16px;
      top: 22px;
      color: #bbb;
      width: 22px;
      height: 22px;
    }
    .card-badge {
      display: inline-block;
      font-size: 1.01rem;
      font-weight: bold;
      color: #e5005a;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.98rem;
      color: #888;
      margin-top: 3px;
      margin-bottom: 0;
      line-height: 1.5;
    }
    /* 포토 투어 */
    .photo-tour-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      border: 1.5px solid #f2f2f2;
      margin: 0 16px 16px 16px;
      padding: 18px 16px 12px 16px;
    }
    .photo-tour-info {
      color: #888;
      font-size: 0.98rem;
      margin-bottom: 10px;
    }
    .photo-tour-imgs {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 8px;
    }
    .photo-tour-imgs img {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border: 1.5px solid #eee;
    }
    .photo-tour-count {
      position: absolute;
      top: 7px;
      left: 7px;
      background: rgba(34,34,34,0.85);
      color: #fff;
      font-size: 0.97rem;
      border-radius: 11px;
      padding: 2px 12px;
      font-weight: 500;
    }
    .photo-tour-task {
      color: #e5005a;
      font-size: 0.98rem;
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .photo-tour-task-dot {
      width: 8px;
      height: 8px;
      background: #e5005a;
      border-radius: 50%;
      display: inline-block;
    }
    /* 정보 카드 */
    .info-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      border: 1.5px solid #f2f2f2;
      margin: 0 16px 16px 16px;
      padding: 18px 16px 10px 16px;
      font-size: 1.02rem;
    }
    .info-label {
      color: #888;
      font-size: 0.96rem;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .info-value {
      font-size: 1.08rem;
      color: #222;
      font-weight: bold;
      margin-bottom: 1px;
    }
    .info-desc {
      color: #888;
      font-size: 0.98rem;
      margin-bottom: 3px;
    }

  </style>
</head>
<body>

    <div class="info-card">

    <!-- 숙소 유형 카드 -->

    <!-- 요금 카드 -->
