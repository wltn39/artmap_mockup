<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Art Map</title>
  <link rel="icon" href="image/pavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
    }
    .container {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 0 80px 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 10px 20px;
    }
    .profile-title {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: -1px;
      line-height: 1.2;
    }
    .profile-bell {
      width: 26px;
      height: 26px;
      stroke: #222;
      opacity: 0.7;
    }
    .greeting {
      padding: 0 20px 8px 20px;
      font-size: 1.55rem;
      font-weight: bold;
      line-height: 1.3;
    }
    .section {
      padding: 0 20px;
    }
    .reservation-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .reservation-tab {
      flex: 1;
      padding: 7px 0;
      border: 1px solid #ccc;
      border-radius: 20px;
      background: #fff;
      font-size: 1rem;
      color: #888;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: border 0.2s, color 0.2s;
    }
    .reservation-tab.active {
      border: 2px solid #222;
      color: #222;
      font-weight: bold;
    }
    .reservation-card {
      background: #fafafa;
      border-radius: 14px;
      border: 1.5px solid #f2f2f2;
      padding: 38px 0 34px 0;
      text-align: center;
      margin-bottom: 18px;
    }
    .reservation-card svg {
      width: 38px;
      height: 38px;
      margin-bottom: 10px;
      color: #bbb;
      opacity: 0.8;
    }
    .reservation-card-text {
      color: #888;
      font-size: 1.07rem;
      margin-top: 2px;
    }
    .all-reserv {
      font-size: 1.01rem;
      margin: 18px 0 18px 0;
      color: #888;
      font-weight: 500;
    }
    .help-section-title {
      font-size: 1.09rem;
      font-weight: bold;
      margin: 24px 0 12px 0;
    }
    .help-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .help-item {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid #f2f2f2;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 1.01rem;
      gap: 14px;
    }
    .help-item svg {
      width: 22px;
      height: 22px;
      color: #222;
      flex-shrink: 0;
    }
    .tips-section-title {
      font-size: 1.09rem;
      font-weight: bold;
      margin: 22px 0 10px 0;
    }
    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }
    .tip-card {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid #f2f2f2;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.02);
    }
    .tip-img {
      width: 68px;
      height: 56px;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }
    .tip-info {
      padding: 0 12px;
      font-size: 1rem;
      color: #222;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 호스트 모드 전환 토스트 */
    .host-toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      border-radius: 22px;
      padding: 13px 28px;
      font-size: 1.07rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeInOut 2.5s;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }   
    
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 헤더 -->
    <div class="profile-header">
      <span class="profile-title"></span>
      <svg class="profile-bell" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11c0-3.07-1.64-5.64-5-6.32V4a1 1 0 0 0-2 0v.68C7.64 5.36 6 7.929 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="greeting">Jaeho 님,<br>반갑습니다!</div>
    <div class="section">
      <div class="reservation-tabs">
        <div class="reservation-tab active">금일 방문 예정(180명)</div>
        <div class="reservation-tab">호스팅 전시/공연(3건)</div>
      </div>
      
      <!-- 예약 현황 원형 그래프 -->
<div class="reservation-card" style="background:#fafafa; border-radius:14px; border:1.5px solid #f2f2f2; padding:34px 0 28px 0; text-align:center; margin-bottom:18px;">
  <div style="display:inline-block; position:relative; width:90px; height:90px; margin-bottom:10px;">
    <svg width="90" height="90">      
        stroke-dasharray="251.2"
        stroke-dashoffset="25.12"
        stroke-linecap="round"
        style="transition:stroke-dashoffset 0.5s;"
        transform="rotate(-90 45 45)"
      />
    </svg>
    <div style="position:absolute; left:0; top:0; width:90px; height:90px; display:flex; flex-direction:column; align-items:center; justify-content:center;">      
      <div class="reservation-card" style="display:flex; align-items:center; justify-content:center; gap:20px; background:#fafafa; border-radius:14px; border:1.5px solid #f2f2f2; padding:28px 0; text-align:center; margin-bottom:18px;">
        <!-- 왼쪽: 원형 파이그래프 -->
        <div class="pie-chart" style="--p:90;">
          <span class="pie-label">90%</span>
        </div>
        <!-- 오른쪽: 텍스트 -->
        <div style="font-size:1.15rem; color:#e5005a; font-weight:bold;">90% 예약</div>
      </div>
    </div>
  </div>
  <div class="reservation-card-text" style="color:#888; font-size:1.07rem; margin-top:6px;">
    최대 정원 200명 중 <span style="color:#e5005a; font-weight:bold;">180명</span>이 예약했습니다.
  </div>
</div>
      
      
      <div class="all-reserv">이번 주 모든 예약 (850개)</div>
      <div class="help-section-title">아트맵이 도와드리겠습니다</div>
      <div class="help-list">
        <div class="help-item">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#222" stroke-width="2"/>
            <path d="M8 15v-1a4 4 0 0 1 8 0v1" stroke="#222" stroke-width="2"/>
            <circle cx="12" cy="9" r="2" stroke="#222" stroke-width="2"/>
          </svg>
          지역 호스트 클럽 가입하기
        </div>
        <div class="help-item">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#222" stroke-width="2"/>
            <path d="M3 10h18" stroke="#222" stroke-width="2"/>
          </svg>
          도움말 센터 방문하기
        </div>
      </div>
      <div class="tips-section-title">자료 및 팁</div>
      <div class="tips-list">
        <div class="tip-card">
          <img class="tip-img" src="https://randomuser.me/api/portraits/men/12.jpg" alt="팁1">
          <div class="tip-info">가입 및 노출 팁</div>
        </div>
        <div class="tip-card">
          <img class="tip-img" src="https://randomuser.me/api/portraits/women/34.jpg" alt="팁2">
          <div class="tip-info">아티스트 회원 / 장소 공유 회원</div>
        </div>
        <div class="tip-card">
          <img class="tip-img" src="https://randomuser.me/api/portraits/men/45.jpg" alt="팁3">
          <div class="tip-info">장소공유 회원 리스트 공유</div>
        </div>
      </div>
    </div>
  </div>
  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
<!-- 홈(체크) 아이콘 -->

        <rect x="3" y="5" width="18" height="16" rx="2"/>

    <a href="my_art.html" class="nav-item">
      <img src="image/geonsi.png" alt="내 일정" width="24" height="24" style="margin-bottom:2px;">
      <span>내 전시</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="#bbb" stroke-width="2" viewBox="0 0 24 24">

        <path d="M8 15h8M8 11h8"/>

    <a href="#" class="nav-item">

  <!-- 호스트 모드 전환 토스트 -->

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    </div>

    </div>
</body>
</html>
