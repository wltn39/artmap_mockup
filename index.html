<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Art Map</title>
  <link rel="icon" href="image/pavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cfad192df2e1e13f18c77c3be9a8e00f"></script>
</head>
<body>
  <!-- 상단 검색바 -->
  <div class="search-bar">
    <input class="search-box" placeholder="검색 시작하기" />
    <button class="search-menu-btn">
      <svg width="20" height="20" fill="none" stroke="#888" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
    </button>
  </div>
  <!-- 카테고리 탭 -->
  <div class="category-tabs" id="categoryTabs">
    <div class="category-tab selected">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="8" cy="10" r="2"/>
            <path d="M21 20l-5.5-6.5-4.5 5.5-3-4L3 20"/>
          </svg>
      갤러리/전시회
    </div>
    <div class="category-tab">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M2 10c0 6 10 12 10 12s10-6 10-12V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v5z"/>
            <path d="M8 10h.01M16 10h.01"/>
          </svg>
      연극/공연
    </div>
    <div class="category-tab">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      사진전
    </div>
    <div class="category-tab">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="11" rx="3"/>
            <path d="M12 17v5"/>
            <path d="M8 22h8"/>
          </svg>
      콘서트
    </div>
    <div class="category-tab">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
      뮤지컬
    </div>    
    </div>
  </div>
  <!-- 숙소 리스트 -->
  <div class="room-list" id="roomList"></div>
  <!-- 지도 표시 플로팅 버튼 -->
  <button class="map-fab" id="mapFab">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A2 2 0 0 1 2 15.382V6.618a2 2 0 0 1 1.553-1.894l5.447-1.724a2 2 0 0 1 1.262 0l5.447 1.724A2 2 0 0 1 22 6.618v8.764a2 2 0 0 1-1.553 1.894L15 20a2 2 0 0 1-1.262 0L9 20z"/><circle cx="12" cy="12" r="3"/></svg>
    지도 표시
  </button>
<!-- 하단 네비게이션 -->
<div class="bottom-nav">
      <a href="index.html">
    <div class="nav-item selected">
      <!-- 검색 (돋보기) -->
      <svg width="20" height="20" fill="none" stroke="#888" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="17" y1="17" x2="21" y2="21"/>
      </svg>      
      검색
    </a>
    </div>
  
    <div class="nav-item">
      <!-- 위시리스트 (하트) -->
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 21C12 21 4 13.5 4 8.5C4 5.42 6.42 3 9.5 3C11.24 3 12.91 3.81 14 5.08C15.09 3.81 16.76 3 18.5 3C21.58 3 24 5.42 24 8.5C24 13.5 16 21 16 21H12Z"/>
      </svg>
      위시리스트
    </div>
    <a href = schedule.html>
    <div class="nav-item">
      <!-- 내 일정 (캔버스) -->
      <img src="image/geonsi.png" alt="내 일정" width="24" height="24" />
      </a>
      내 일정
    </div>
    <div class="nav-item">
      <!-- 메시지 (말풍선) -->
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      메시지
    </div>
    <a href="profile.html">
    <div class="nav-item">
      <!-- 프로필 (사람) -->
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a4 4 0 0 1 8 0v2"/>
      </svg>
    </a>
      프로필
    
    </div>
  
  </div>
  <script src="script.js"></script>
</body>
</html>
