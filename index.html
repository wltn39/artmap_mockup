<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>에어비엔비 모바일 프로토타입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 검색바 -->
  <div class="search-bar">
    <input class="search-box" placeholder="검색 시작하기" />
    <button class="search-menu-btn">
      <svg width="20" height="20" fill="none" stroke="#888" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
    </button>
  </div>
  <!-- 카테고리 탭 -->
  <div class="category-tabs" id="categoryTabs">
    <div class="category-tab selected">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="8" rx="2"/><path d="M2 10l10-6 10 6"/></svg>
      한적한 시골
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
      컬렉션 아이콘
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      최고의 전망
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="8" rx="2"/><path d="M2 10l10-6 10 6"/></svg>
      한옥
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="8" rx="2"/><path d="M2 10l10-6 10 6"/></svg>
      유르트
    </div>
    <div class="category-tab">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 20h20M12 4v16"/></svg>
      해변 근처
    </div>
  </div>
  <!-- 숙소 리스트 -->
  <div class="room-list" id="roomList"></div>
  <!-- 지도 표시 플로팅 버튼 -->
  <button class="map-fab" id="mapFab">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A2 2 0 0 1 2 15.382V6.618a2 2 0 0 1 1.553-1.894l5.447-1.724a2 2 0 0 1 1.262 0l5.447 1.724A2 2 0 0 1 22 6.618v8.764a2 2 0 0 1-1.553 1.894L15 20a2 2 0 0 1-1.262 0L9 20z"/><circle cx="12" cy="12" r="3"/></svg>
    지도 표시
  </button>
  <!-- 하단 네비게이션 -->
  <div class="bottom-nav">
    <div class="nav-item selected">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
      검색
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      위시리스트
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 8 0v2"/></svg>
      로그인
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
